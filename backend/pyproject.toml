[project]
name = "telecom-support"
version = "0.1.0"
description = "Multi-agent customer support assistant for a fictional mobile operator"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.142.3",
    "httpx>=0.28.1",
    "langchain-core>=1.6.7",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.14",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
